<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08060f" />
    <meta
      name="description"
      content="DevOps Engineer focused on Kubernetes, CI/CD, observability, infrastructure automation and practical MLOps projects."
    />
    <meta property="og:locale" content="en_US" />
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const saved = (key) => {
          try {
            return localStorage.getItem("sergey-frolov-" + key);
          } catch {
            return null;
          }
        };
        const choose = (key, values, storageKey, fallback) => {
          const query = params.get(key),
            stored = saved(storageKey);
          return values.includes(query)
            ? query
            : values.includes(stored)
              ? stored
              : fallback;
        };
        const theme = choose(
          "theme",
          ["dark", "light"],
          "theme",
          matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
        );
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = choose(
          "lang",
          ["en", "ru"],
          "language",
          navigator.language.toLowerCase().startsWith("ru") ? "ru" : "en",
        );

        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#08060f" : "#f7f4fc";
        window.__opsmonPreferences = {
          system:
            !["dark", "light"].includes(params.get("theme")) &&
            !["dark", "light"].includes(saved("theme")),
        };
      })();
    </script>
    <style>
      html[data-theme="dark"] {
        background: #08060f;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #f7f4fc;
        color-scheme: light;
      }
    </style>
